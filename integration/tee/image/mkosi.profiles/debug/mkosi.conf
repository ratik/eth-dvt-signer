# The debug image: the release image plus an SSH server (keys from the configuration file
# `ssh-authorized-keys`) and a root shell on the serial console. Its root, initrd and command
# line differ, so its UKI (RTMR1) and verity root hash (RTMR2) differ: no key release policy
# admits it. For recovery and diagnosis only (README).
[Content]
Packages=
        openssh-server
        procps
        iproute2
        less
RootPassword=hashed:
KernelCommandLine=eth-mpc.image=debug
