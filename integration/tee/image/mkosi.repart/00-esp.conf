# The ESP: GRUB as the default boot application (EFI/BOOT/BOOTX64.EFI) with its configuration,
# and the UKI it chainloads (EFI/Linux/eth-mpc-signer.efi). mkosi (Bootloader=uki) writes the UKI
# to /efi/EFI/BOOT/BOOTX64.EFI, `qemu.sh build` GRUB to /efi/grub/; this places both.
# systemd-repart formats it with 4 KiB sectors: below about 260 MB that leaves FAT32 too few
# clusters, and OVMF (GCE's firmware too) then does not read it. 512 MB, as mkosi's default; the
# raw image stays sparse.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi/grub/BOOTX64.EFI:/EFI/BOOT/BOOTX64.EFI
CopyFiles=/efi/grub/grub.cfg:/EFI/BOOT/grub.cfg
CopyFiles=/efi/EFI/BOOT/BOOTX64.EFI:/EFI/Linux/eth-mpc-signer.efi
SizeMinBytes=512M
SizeMaxBytes=512M
