# The ESP: only the UKI, at EFI/BOOT/BOOTX64.EFI (mkosi's Bootloader=uki). systemd-repart formats
# it with 4 KiB sectors: below about 260 MB that leaves FAT32 too few clusters, and OVMF (GCE's
# firmware too) then does not read it. 512 MB, as mkosi's default; the raw image stays sparse.
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
SizeMinBytes=512M
SizeMaxBytes=512M
