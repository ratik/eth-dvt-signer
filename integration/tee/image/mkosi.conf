# The node's closed VM image (integration/tee/README.md): a GPT disk whose ESP holds one UKI
# (kernel, initrd and a command line carrying the dm-verity root hash) as the default EFI boot
# application, and a read-only erofs root under dm-verity with the node binary in it. No SSH, no
# login shell, no Google guest agent; logs go to the serial console.
#
# Built by `integration/tee/qemu.sh build`, which passes what is not in this file: the Debian
# snapshot (a sandbox tree with the apt sources), SOURCE_DATE_EPOCH, the node binary, the token
# helper and gotpm (an extra tree), and the output and cache directories. `--profile debug` adds an SSH server
# and a root shell on the serial console: a different root, so a different UKI and measurement.

[Config]
# The initrd (mkosi.images/initrd): mkosi's default one, locked down like the root.
Dependencies=initrd

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64

[Output]
Format=disk
ImageId=eth-mpc-signer
Output=eth-mpc-signer
ManifestFormat=json
SplitArtifacts=uki
# Partition and file system UUIDs and the verity salt derive from it (reproducible builds).
Seed=3ab37d93-deb0-46a4-8e9b-83f4a01d1ae7

[Content]
Bootable=yes
Bootloader=uki
Initrds=%O/initrd
WithDocs=no
Packages=
        # Linux 6.16 or later: user space extends RTMR3 (tdx_guest measurements). trixie has 6.12;
        # its backports have 7.2. The cloud flavor has GCE's NVMe and gVNIC drivers.
        linux-image-cloud-amd64/trixie-backports
        # systemd-stub, measuring into the TDX RTMRs (257).
        systemd-boot-efi
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        util-linux
        e2fsprogs
        # The configuration from GCE instance metadata, and the node's TLS roots (STS, KMS).
        curl
        ca-certificates
        # The measure mode's client of the token helper's socket.
        netcat-openbsd
KernelCommandLine=
        console=ttyS0,115200
        # The kernel writes to the console itself, between any process's writes: only warnings
        # and worse, so it does not cut the lines the node's tools read there (statements,
        # tokens). The rest reaches the console through the journal, whole.
        loglevel=4
        # The root is read-only (verity); /var is a tmpfs, the data disk is mounted under it.
        systemd.volatile=state
        systemd.firstboot=no
        panic=10
        # GCE persistent disks on NVMe (C3): no I/O timeout (Google's recommendation).
        nvme_core.io_timeout=4294967295
RemoveFiles=
        # Build-time logs and caches carry timestamps (reproducibility) and are hidden by the
        # tmpfs on /var anyway.
        /var/log/*
        /var/cache/*
        /var/lib/dpkg/*-old
        /etc/ssh/ssh_host_*

[Build]
# Partitions are written as files, never through loop devices of the build host.
RepartOffline=yes
WithNetwork=no
