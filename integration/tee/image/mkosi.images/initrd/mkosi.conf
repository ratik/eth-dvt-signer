# The UKI's initrd: mkosi's default one, plus mkosi.postinst.chroot. On a boot failure (say, a
# root that dm-verity refuses) the default initrd enters emergency mode, and `systemctl default`
# after it starts a getty on the serial console. This one has neither in the release image.
[Include]
Include=mkosi-initrd

[Output]
Output=initrd
