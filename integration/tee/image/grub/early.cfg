# GRUB's embedded configuration (`qemu.sh build`, grub-mkimage --config): part of the GRUB binary,
# so of its Authenticode digest in RTMR1. GRUB's rescue parser runs it before normal mode, which
# then runs $prefix/grub.cfg (the ESP's /EFI/BOOT/grub.cfg). It is not measured as commands.
#
# A superuser without a password: should grub.cfg ever end without booting, normal mode's command
# line and menu editor ask for a login nobody has, so there is no GRUB shell.
set superusers=root
