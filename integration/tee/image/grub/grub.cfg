# GRUB's configuration on the ESP (/EFI/BOOT/grub.cfg; README "Boot"). GRUB measures this file
# and each command it runs, as text, into RTMR2 (PCR 8 and 9 on a TPM): Google's attestation
# needs those GRUB events. Commands are literal (no variables), so the measured text is the same on
# every VM, and lib/measure.py predicts it from this file: one command per line, nothing else.
#
# The UKI is chainloaded without arguments: systemd-stub then boots its embedded command line
# (roothash=). The firmware measures it on loading (RTMR1), GRUB measures the file (RTMR2).
# Should booting fail, reboot (no menu, no shell).
chainloader /EFI/Linux/eth-mpc-signer.efi
boot
reboot
