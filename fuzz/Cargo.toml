# Coverage-guided fuzz targets (`cargo fuzz`, nightly): one per input a peer, an API client, the
# anchor or the disk can give a node. The properties live in `src/fuzzing.rs`; inputs a campaign
# finds go to `regressions/<target>`, which `tests/fuzz_regressions.rs` replays on stable Rust.
# Run them with `integration/ethereum/scripts/env.sh fuzz <target|all> <seconds>`.

[package]
name = "eth-mpc-signer-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eth-mpc-signer = { path = "..", features = ["fuzzing"] }

# Not a member of the signer's build.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "transaction"
path = "fuzz_targets/transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block"
path = "fuzz_targets/block.rs"
test = false
doc = false
bench = false

