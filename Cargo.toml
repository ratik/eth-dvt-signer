[package]
name = "eth-mpc-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Ethereum MPC signer built on commonware: BLS12-381 DKG and consensus-authorized threshold signing"
publish = false
# The fuzz targets are a crate of their own (nightly, `cargo fuzz`).
exclude = ["fuzz"]

[features]
# Fault injection for the real-process end-to-end tests (see `src/hooks.rs`). Never enable it in
# a deployment.
test-hooks = ["dev-api"]
# The raw signing API (`POST /sign`, `GET /authorizations`) for development and tests: signs any
# payload with a development key. Never enable it in a deployment.
dev-api = []
# Fuzzing entry points (`src/fuzzing.rs`) for the `fuzz/` crate and `tests/fuzz_regressions.rs`.
# Never enable it in a deployment.
fuzzing = []

[dependencies]
commonware-actor = "2026.9.0"
commonware-broadcast = "2026.9.0"
commonware-codec = "2026.9.0"
commonware-consensus = "2026.9.0"
commonware-cryptography = { version = "2026.9.0", features = ["bls12381"] }
commonware-macros = "2026.9.0"
commonware-math = "2026.9.0"
commonware-p2p = "2026.9.0"
commonware-parallel = "2026.9.0"
commonware-resolver = "2026.9.0"
commonware-runtime = "2026.9.0"
commonware-storage = { version = "2026.9.0", features = ["std"] }
commonware-utils = "2026.9.0"

anyhow = "1"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
hex = "0.4"
rand = "0.10.3"
rand_core = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tree_hash = "0.12"
tree_hash_derive = "0.12"
ethereum_ssz = "0.10"
ethereum_ssz_derive = "0.10"
ethereum_serde_utils = "0.8.1"
typenum = "1"

# Offline key import (`import`, `mpc-keytool`): EIP-2335 keystores and share encryption.
aes = "0.9"
ctr = "0.10"
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rpassword = "7"
scrypt = { version = "0.12", default-features = false }
sha2 = "0.11"
# The WORM anchor (`anchor`, docs/anchor.md): append-only records on S3, GCS or a local directory.
# No default features: the HTTP stores and the filesystem store only (rustls with aws-lc).
object_store = { version = "0.14.2", default-features = false, features = ["aws", "gcp", "fs"] }
unicode-normalization = "0.1"
zeroize = "1"

[dev-dependencies]
# Reference BLS implementation of Ethereum consensus clients (already used by commonware).
blst = { version = "0.3.17", default-features = false, features = ["no-threads"] }
commonware-p2p = { version = "2026.9.0", features = ["mocks"] }
serde_yaml = "0.9"

# Real processes, real p2p and HTTP: slow, run with `cargo test --features test-hooks --test e2e`.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["test-hooks"]

# EIP-2335 key derivation (scrypt, PBKDF2) is slow without optimizations, also in tests.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
