[package]
name = "eth-dvt-signer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "Ethereum DVT signer built on commonware: BLS12-381 DKG and consensus-authorized threshold signing"
publish = false
# The fuzz targets are a crate of their own (nightly, `cargo fuzz`).
exclude = ["fuzz"]

[features]
# Fault injection for the real-process end-to-end tests (see `src/hooks.rs`). Never enable it in
# a deployment.
test-hooks = ["dev-api", "fake-gcp"]
# The sealed vault's test endpoints (`--gcp-token-url`, `--gcp-sts-endpoint`, `--gcp-kms-endpoint`,
# `--gcp-metadata-endpoint`), for `tee-fake-gcp`. A host could point a node built with it at its
# own KMS, which sees the vault's data key. Never enable it in an image a key release admits.
fake-gcp = []
# The raw signing API (`POST /sign`, `GET /authorizations`) for development and tests: signs any
# payload with a development key. Never enable it in a deployment.
dev-api = []
# Fuzzing entry points (`src/fuzzing.rs`) for the `fuzz/` crate and `fuzzing::tests`.
# Never enable it in a deployment.
fuzzing = []

[dependencies]
commonware-actor = "=2026.10.0"
commonware-broadcast = "=2026.10.0"
commonware-codec = "=2026.10.0"
commonware-consensus = "=2026.10.0"
commonware-cryptography = { version = "=2026.10.0", features = ["bls12381"] }
commonware-macros = "=2026.10.0"
commonware-math = "=2026.10.0"
commonware-p2p = "=2026.10.0"
commonware-parallel = "=2026.10.0"
commonware-resolver = "=2026.10.0"
commonware-runtime = "=2026.10.0"
commonware-storage = { version = "=2026.10.0", features = ["std"] }
commonware-stream = "=2026.10.0"
commonware-utils = "=2026.10.0"

anyhow = "1"
axum = "0.8.9"
bytes = "1.12.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
hex = "0.4"
rand = "=0.10.3"
rand_core = "=0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["net", "rt", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tree_hash = "=0.12.1"
tree_hash_derive = "0.12"
ethereum_ssz = "0.10"
ethereum_ssz_derive = "0.10"
ethereum_serde_utils = "0.8.1"
typenum = "1"

# Offline key import (`import`, `mpc-keytool`): EIP-2335 keystores and share encryption.
aes = "=0.9.4"
ctr = "=0.10.1"
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
rpassword = "7"
scrypt = { version = "=0.12.0", default-features = false }
sha2 = "=0.11.1"
# The WORM anchor (`anchor`, docs/anchor.md): append-only records on S3, GCS or a local directory.
# No default features: the HTTP stores and the filesystem store only (rustls with aws-lc).
object_store = { version = "0.14.2", default-features = false, features = ["aws", "gcp", "fs"] }
unicode-normalization = "=0.1.26"
zeroize = "=1.9.1"
# Sealed vaults (`vault`, docs/tee.md): items and secrets under a data key that Cloud KMS releases to
# an attested image; attestation tokens checked by clients (`attestation`). Crates already in the
# tree through `hpke` and `object_store`.
aws-lc-rs = "=1.19.0"
base64 = "0.23"
chacha20poly1305 = "=0.11.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# The `sev-snp` platform (`attestation::snp`, `vault::snp`): AMD's certificates (X.509, RSA-PSS) and
# the guest device's ioctls. Both crates are already in the tree.
libc = "0.2"
x509-parser = { version = "=0.18.1", default-features = false }
# The mTLS listener (`tls`): TLS 1.3 with a required client certificate, its key made in the vault.
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["alloc"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
# The gateway's metrics (`gateway`, `mpc-gateway`, docs/gateway.md): already in the tree through
# commonware-runtime.
prometheus-client = "0.25"
# Pins only: crypto crates the signer gets through the crates above, fixed to exact versions here.
# No features of their own, so the build is the same as without these lines.
# blst: BLS signatures (commonware-cryptography); aws-lc-sys: AWS-LC (aws-lc-rs, rustls);
# ethereum_hashing: SHA-256 of signing roots (tree_hash).
blst = { version = "=0.3.17", default-features = false }
aws-lc-sys = { version = "=0.47.0", default-features = false }
ethereum_hashing = { version = "=0.8.0", default-features = false }

[dev-dependencies]
# Reference BLS implementation of Ethereum consensus clients (already used by commonware).
blst = { version = "=0.3.17", default-features = false, features = ["no-threads"] }
commonware-p2p = { version = "=2026.10.0", features = ["mocks"] }
serde_yaml = "0.9"

# The fake of Google's attestation, STS and KMS as a service, for sealed nodes in QEMU VMs
# (`integration/tee`): tests only.
[[bin]]
name = "tee-fake-gcp"
path = "src/bin/tee-fake-gcp.rs"
required-features = ["test-hooks"]

# Real processes, real p2p and HTTP: slow, run with `cargo test --features test-hooks --test e2e`.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["test-hooks"]

# `cfg(kani)`: the Kani proofs of the slashing rules (formal/kani, docs/formal.md).
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# EIP-2335 key derivation (scrypt, PBKDF2) is slow without optimizations, also in tests.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3
